[package]
name = "alice-cloud-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Cloud gateway for ALICE edge-to-cloud SDF streaming pipeline"
license = "LicenseRef-Proprietary"
keywords = ["gateway", "sdf", "streaming", "edge-computing"]
publish = false

[dependencies]
# ALICE Ecosystem
alice-db = { path = "../ALICE-DB", features = ["sdf"] }
alice-cache = { path = "../ALICE-Cache" }
alice-sync = { path = "../ALICE-Sync", features = ["cloud"] }
alice-cdn = { path = "../ALICE-CDN", features = ["sdf"] }
alice-crypto = { path = "../ALICE-Crypto", default-features = false, features = ["std"] }
alice-analytics = { path = "../ALICE-Analytics", default-features = false, features = ["std"] }
libasp = { path = "../ALICE-Streaming-Protocol", default-features = false }

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Concurrency
parking_lot = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# one alice-det-math in the build: alice-db asks crates.io for 0.5.1, the siblings' alice-zip uses this rev
[patch.crates-io]
alice-det-math = { git = "https://github.com/ext-sakamoro/ALICE-DetMath", rev = "6384856c8b00f1615e1cd6b5c74d88036c1a8706", version = "0.5.2" }
