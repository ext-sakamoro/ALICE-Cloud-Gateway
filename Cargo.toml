[package]
name = "alice-cloud-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Cloud gateway for ALICE edge-to-cloud SDF streaming pipeline"
license = "LicenseRef-Proprietary"
keywords = ["gateway", "sdf", "streaming", "edge-computing"]
publish = false

[dependencies]
# ALICE Ecosystem
alice-db = { version = "0.6.0", git = "https://github.com/ext-sakamoro/ALICE-DB", branch = "main", features = ["sdf"] }
alice-cache = { version = "0.2.0", git = "https://github.com/ext-sakamoro/ALICE-Cache", branch = "main" }
alice-sync = { version = "0.8.0", git = "https://github.com/ext-sakamoro/ALICE-Sync", branch = "main", features = ["cloud"] }
alice-cdn = { version = "0.2.0", git = "https://github.com/ext-sakamoro/ALICE-CDN", branch = "main", features = ["sdf"] }
alice-crypto = { version = "0.7.0", git = "https://github.com/ext-sakamoro/ALICE-Crypto", branch = "main", default-features = false, features = ["std"] }
alice-analytics = { version = "0.7.0", git = "https://github.com/ext-sakamoro/ALICE-Analytics", branch = "main", default-features = false, features = ["std"] }
libasp = { version = "1.1.0", git = "https://github.com/ext-sakamoro/ALICE-Streaming-Protocol", branch = "main", default-features = false }

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Concurrency
parking_lot = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
