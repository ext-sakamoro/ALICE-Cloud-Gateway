name: CI

on:
  push:
    # ci/** runs the whole workflow on a branch before it is landed on main
    branches: [main, "ci/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # the passed-test count at the commit that set it; fewer passed tests
      # (a removed or skipped test, or none at all) is a failure
      MIN_PASSED: "148"
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Cloud-Gateway
      - uses: dtolnay/rust-toolchain@stable
      - name: Lock (every alice-* from git, none by path or from a registry, at most one alice-det-math)
        working-directory: ALICE-Cloud-Gateway
        shell: bash
        run: |
          python3 - <<'PY'
          import sys, tomllib
          pk = [p for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"].startswith("alice")]
          bad = [f'{p["name"]} {p["version"]} {p.get("source", "path")}' for p in pk
                 if p["name"] != "alice-cloud-gateway" and not p.get("source", "").startswith("git+")]
          dm = [p for p in pk if p["name"] == "alice-det-math"]
          print(f"lock: {len(pk) - 1} alice-* dependencies, {len(bad)} not from git, {len(dm)} alice-det-math")
          if len(pk) < 2 or bad or len(dm) > 1:
              sys.exit("\n".join(bad) or "expected an alice-* dependency and at most one alice-det-math")
          PY
      - name: Test (lib, integration, doctests)
        working-directory: ALICE-Cloud-Gateway
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          cargo test --locked 2>&1 | tee "${log}"
          passed=$(grep -E '^test result: ' "${log}" | awk '{s += $4} END {print s + 0}')
          failed=$(grep -E '^test result: ' "${log}" | awk '{s += $6} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED}), failed: ${failed}"
          if [ "${failed}" -ne 0 ] || grep -E '^test result: ' "${log}" | grep -vE '^test result: ok\. ' >/dev/null; then
            echo "::error::${failed} tests failed"
            exit 1
          fi
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi

  clippy:
    name: Clippy (all targets, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Cloud-Gateway
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        working-directory: ALICE-Cloud-Gateway
        run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Cloud-Gateway

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        working-directory: ALICE-Cloud-Gateway
        run: cargo fmt --check

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
